---
layout: default
title: 搜索
permalink: /search/
---

<div class="page-content">
    <div class="container">
        <div class="page-header">
            <h1>{{ page.title }}</h1>
            <p class="page-header__lede">在全部 {{ site.posts | size }} 篇文章中检索标题、标签与正文。</p>
        </div>

        <form class="search-form" role="search" method="get" action="{{ '/search/' | relative_url }}">
            <label class="visually-hidden" for="search">搜索关键字</label>
            <input type="search" id="search" name="q" placeholder="输入关键字，例如 docker、iptables…"
                   autocomplete="off" required>
            <button type="submit">搜索</button>
        </form>

        <p class="search-status" id="search-status" hidden></p>
        <div class="search-results" id="search-results"></div>

        <noscript>
            <p class="search-status">搜索需要启用 JavaScript。</p>
        </noscript>
    </div>
</div>

<script>
    window.SITE_BASEURL = "{{ site.baseurl }}";
</script>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
